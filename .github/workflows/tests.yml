name: tests

on:
  push:
  pull_request:

# Read-only. A test run has no business writing to the repository, and this job does not need a
# token that can. It was load-bearing while unit_test/ still held a "test" that made git commits;
# that has moved to tools/package.py, and the permission stays because the reasoning does.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Only 3.13 for now, because that is the version the suite has actually been run on.
          # The install guide claims 3.10.5 and 3.14.2 also work; widening this matrix is worth
          # doing once someone has confirmed it rather than assuming it.
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      # tools/run_tests.py rather than `unittest discover`: discovery also picks up test_all,
      # which replays recorded games that are not in the repository. Discovery is otherwise safe
      # now that the packaging chores are out of unit_test/.
      - run: python tools/run_tests.py

  typescript:
    name: client type check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both majors, deliberately. 7 removed the moduleResolution value this project used to
        # set, which broke the build for anyone on a current toolchain, and 5 is what existing
        # contributors still have installed. The config has to keep working on both.
        typescript: ['5', '7']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npx -y -p typescript@${{ matrix.typescript }} tsc --noEmit
        working-directory: public/js
