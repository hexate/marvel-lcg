name: tests

on:
  push:
  pull_request:

# Read-only. Nothing here should be able to write to the repository, and one of the things under
# unit_test/ makes git commits when it runs, so this is not merely hygiene.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Only 3.13 for now, because that is the version the suite has actually been run on.
          # The install guide claims 3.10.5 and 3.14.2 also work; widening this matrix is worth
          # doing once someone has confirmed it rather than assuming it.
          python-version: '3.13'
          cache: pip

      - run: pip install -r requirements.txt

      # tools/run_tests.py rather than `unittest discover`: discovery would also pick up
      # unit_test/test_task.py, which rewrites build.py and runs `git commit`.
      - run: python tools/run_tests.py

  typescript:
    name: client type check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both majors, deliberately. 7 removed the moduleResolution value this project used to
        # set, which broke the build for anyone on a current toolchain, and 5 is what existing
        # contributors still have installed. The config has to keep working on both.
        typescript: ['5', '7']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npx -y -p typescript@${{ matrix.typescript }} tsc --noEmit
        working-directory: public/js
