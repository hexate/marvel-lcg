<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Champions: Digital Edition</title>
    <link rel="stylesheet" href="/public/css/menu/controls.css">
    <style>
        /* Page shape only. Every control on this page is styled by `css/menu/controls.css`,
           which the setup page loads too, so the two agree. */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: var(--font-ui);
            margin: 0;
        }

        .menu {
            text-align: center;
        }

        #version {
            height: 2rem;
        }

        /* Currently commented out of the markup below, kept correct so it still works if it
           comes back. It sets the button's own colour rather than painting over it. */
        .wild-mode {
            --color: rgb(161, 129, 0);
        }
    </style>
</head>

<body>
    <div class="menu">
        <h1>Marvel Champions</h1>
        <h2>Digital Edition</h2>
        <div id="version"></div>
        <div style="margin-bottom: 5rem;"></div>
        <script>
            function Open(url) {
                window.location.href = url
            }
        </script>

        <style>
            .main{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
            }
        </style>

        <div class="main">
            <button class="primary" onclick="Open('scene')">
                <span>New Game</span>
            </button>
            <button onclick="Open('replay')">
                <span>Replay</span>
            </button>
            <button onclick="Open('deck')">
                <span>Deck Editor</span>
            </button>
            <button onclick="Open('cards')">
                <span>View Cards</span>
            </button>
            <button onclick="Open('puzzle')">
                <span>Puzzle</span>
            </button>
            <button onclick="Open('credits')">
                <span>Credits</span>
            </button>
        </div>

        <!-- <hr/>

        <div class="main">
            <button class="wild-mode" onclick="doReplay('./wild.json')">
                <span>Wild Mode</span>
            </button>
        </div> -->
    </div>

    <script>
        // Function to get a cookie
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        (async () => {
            // const response_version = await fetch(`get_version?`);
            // version = await response_version.text();
            const version = getCookie('app_version')
            const versionElement = document.querySelector(`#version`);
            versionElement.innerHTML = `v${version}`;
        })()
    </script>

    <script>
function doReplay(file_name) {
    var ajax = new XMLHttpRequest();
    let cmd = `load_replay?${file_name}`
    ajax.open("GET", cmd, true);
    ajax.onreadystatechange = function () {
        if( this.readyState == 4 ) {
            console.log('ok')
            cmd = ".?hot_seat&3d_scene"
            window.open(cmd)
        }
    }
    ajax.send();
}
    </script>

</body>

</html>
